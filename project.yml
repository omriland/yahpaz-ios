name: Yahpaz
options:
  bundleIdPrefix: com.yahpz
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_LANGUAGE: he
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  YahpazDomain:
    path: .
  supabase-swift:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.31.0"
targets:
  Yahpaz:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
    resources:
      - path: App/Resources
        optional: true
      - path: App/Resources/car-logos
        type: folder
        optional: true
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: אבן דרך
        CFBundleName: Yahpaz
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "9"
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations:
          - he
        UIRequiresFullScreen: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: אבן דרך משתמש במיקום כדי לשתף את מיקומך עם האחמ״ש בזמן אירוע. אפשר לעצור בכל רגע מסך המעקב.
        NSLocationAlwaysAndWhenInUseUsageDescription: אבן דרך ממשיך לשתף מיקום גם כשהמסך כבוי כל עוד שובצת לאירוע פתוח.
        NSCameraUsageDescription: אבן דרך משתמש במצלמה לסריקת לוחית רישוי בעת תיעוד אירוע.
        NSMicrophoneUsageDescription: אבן דרך משתמש במיקרופון כדי להקליט הודעת משוב. אפשר לכתוב הערה במקום.
        UIBackgroundModes:
          - location
        CFBundleURLTypes:
          - CFBundleURLName: com.yahpz.responder
            CFBundleURLSchemes:
              - yahpaz
        LSApplicationQueriesSchemes:
          - itms-services
        UIAppFonts:
          - IBMPlexSansHebrew-Regular.ttf
          - IBMPlexSansHebrew-Medium.ttf
          - IBMPlexSansHebrew-SemiBold.ttf
          - IBMPlexSansHebrew-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - SuezOne-Regular.ttf
    settings:
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/Yahpaz-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Yahpaz.entitlements
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yahpz.responder
        PRODUCT_NAME: Yahpaz
        INFOPLIST_KEY_CFBundleDisplayName: אבן דרך
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 477WWCHXU7
        CODE_SIGN_IDENTITY: Apple Development
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 9
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited)
    dependencies:
      - package: YahpazDomain
        product: YahpazDomain
      - package: supabase-swift
        product: Supabase
      - sdk: WebKit.framework
