<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אבן דרך — התקנה ל-iPhone</title>
  <link rel="canonical" href="https://yahpz.com/ios" />
  <meta http-equiv="refresh" content="5; url=https://yahpz.com/ios" />
  <style>
    :root {
      --page: #182A47;
      --card: #ffffff;
      --text: #0F1B2D;
      --muted: #445A73;
      --accent-fill: #2E6CB4;
      --on-dark: #F2F6FA;
      --secondary: #C3CEDD;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans Hebrew", "Helvetica Neue", Arial, sans-serif;
      background: var(--page);
      color: var(--on-dark);
    }
    main { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-family: "Suez One", serif; font-size: 40px; font-weight: 400; margin: 0 0 8px; }
    .kicker { color: var(--secondary); font-size: 14px; margin-bottom: 28px; }
    .card {
      background: var(--card);
      color: var(--text);
      border-radius: 8px;
      padding: 24px;
      margin: 0 0 16px;
    }
    h2 { font-size: 17px; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.55; color: var(--muted); }
    a.btn {
      display: block;
      text-align: center;
      background: var(--accent-fill);
      color: white;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 4px;
      font-weight: 600;
      margin: 12px 0 0;
    }
    .note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>אבן דרך</h1>
    <p class="kicker">אפליקציית כוננים ל-iPhone</p>

    <section class="card">
      <h2>ההתקנה עברה לאתר יחפ״צ</h2>
      <p>
        העמוד הזה כבר לא בשימוש. ההתקנה מתבצעת עכשיו ישירות מ־yahpz.com,
        בדפדפן ספארי באייפון.
      </p>
      <a class="btn" href="https://yahpz.com/ios">מעבר לעמוד ההתקנה</a>
      <p class="note">
        ההתקנה אפשרית רק במכשיר שנרשם מראש אצל מנהל המערכת. אם עוד לא נרשמתם - פנו אליו.
      </p>
    </section>
  </main>
</body>
</html>
